name: CI

# Runs on every pull request and on main, so a change that would break the
# Pages deploy fails here first. The missing src/data incident reached main
# because nothing built a clean checkout before merge.
on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The repo has no ESLint config; the TypeScript compiler is the static
      # check available today.
      - name: Typecheck
        run: npx tsc --noEmit

      # Includes the citation guards: every clinical claim sourced from the
      # registry, no absolute clinical language, all links and terms resolve.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build -- --base="/digital-guide/"
