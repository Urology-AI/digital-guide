name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://digital-chat.onrender.com
          VITE_SPEECH_API_BASE_URL: ${{ secrets.VITE_SPEECH_API_BASE_URL || 'https://digital-chat.onrender.com' }}
          # Patient guide chat → Cloudflare worker.
          # VITE_COMPASS_CHAT_URL: set as a repo Variable once the worker is deployed.
          #   Empty is fine — the guide chat then answers offline from bundled content.
          # VITE_TURNSTILE_SITE_KEY: public Turnstile site key (safe to commit as the
          #   default below); override via a repo Variable if it changes.
          VITE_COMPASS_CHAT_URL: ${{ vars.VITE_COMPASS_CHAT_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAEd5DVBFQAaeSWNY' }}
        run: npm run build -- --base="/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

